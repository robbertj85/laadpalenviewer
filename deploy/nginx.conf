# Front container for prototype.transportlab.app/laadpalenviewer/.
# Nginx Proxy Manager forwards the path unchanged (no URI rewrite), so every
# location here carries the /laadpalenviewer prefix.
#
#   /laadpalenviewer/data/*              -> data volume (written live by the worker)
#   /laadpalenviewer/municipalities.json -> data volume
#   everything else                      -> Next.js app (app-laadpalenviewer: pages, _next assets, /api/*)

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types application/json application/geo+json text/plain text/css application/javascript;

server {
  listen 80;
  server_name _;

  # Data changes hourly (status) or nightly (crop-outs): always revalidate.
  # nginx answers conditional requests with 304, so repeat visits stay cheap
  # and nobody sees hour-old data after a refresh.
  location /laadpalenviewer/data/ {
    alias /srv/lpv/public/data/;
    types {
      application/geo+json geojson;
      application/json json;
    }
    add_header Cache-Control "public, no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin * always;
  }

  location = /laadpalenviewer/municipalities.json {
    alias /srv/lpv/public/municipalities.json;
    default_type application/json;
    add_header Cache-Control "public, no-cache" always;
  }

  location /laadpalenviewer {
    # Static container name (Coolify "consistent container names"), not the
    # service name: `web` is also on the shared coolify network, where a bare
    # `app` can resolve to another application's container.
    proxy_pass http://app-laadpalenviewer:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # App root with a trailing slash: serve it instead of letting Next redirect
  # to /laadpalenviewer. A proxy location "/laadpalenviewer/" (as NPM custom
  # locations usually are) redirects the other way, so the two would loop.
  location = /laadpalenviewer/ {
    rewrite ^ /laadpalenviewer break;
    proxy_pass http://app-laadpalenviewer:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
